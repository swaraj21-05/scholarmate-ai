<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile | ScholarMate AI</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <div class="brand-name">ScholarMate AI</div>
          <div class="brand-subtitle">Student profile</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="./index.html">Home</a>
        <a href="./dashboard.html">Dashboard</a>
        <a class="active" href="./profile.html">Student Profile</a>
        <a href="./scholarships.html">Scholarships</a>
        <a href="./eligibility.html">Eligibility</a>
        <a href="./documents.html">Documents</a>
        <a href="./tracker.html">Tracker</a>
      </nav>

      <div class="sidebar-badge">
        Demo-mode only
      </div>
    </aside>

    <main class="page-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">Profile setup</p>
          <h1>Student information</h1>
        </div>
        <a class="button button-secondary" href="./dashboard.html">Back to Dashboard</a>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h3>Choose a demo profile</h3>
        </div>

        <div class="form-row">
          <label for="demo-profile">Demo profile</label>
          <select id="demo-profile">
            <option value="eligible">1. Meets criteria</option>
            <option value="ineligible">2. Fails mandatory requirement</option>
            <option value="missing">3. Missing required information</option>
          </select>
        </div>
      </section>

      <form id="profile-form" class="panel form-panel" novalidate>
        <div class="panel-header">
          <h3>Basic details</h3>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Full name" required />
          </div>

          <div class="field">
            <label for="state">State</label>
            <select id="state" name="state" required>
              <option value="">Select state</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="Tamil Nadu">Tamil Nadu</option>
              <option value="Delhi">Delhi</option>
              <option value="West Bengal">West Bengal</option>
              <option value="Kerala">Kerala</option>
            </select>
          </div>

          <div class="field">
            <label for="course">Course</label>
            <select id="course" name="course" required>
              <option value="">Select course</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Engineering">Engineering</option>
              <option value="Business Administration">Business Administration</option>
              <option value="Biotechnology">Biotechnology</option>
              <option value="Economics">Economics</option>
              <option value="Law">Law</option>
            </select>
          </div>

          <div class="field">
            <label for="studyYear">Study year</label>
            <select id="studyYear" name="studyYear" required>
              <option value="">Select year</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>

          <div class="field">
            <label for="college">College</label>
            <input id="college" name="college" type="text" placeholder="College name" required />
          </div>

          <div class="field">
            <label for="academicMarks">Academic marks (%)</label>
            <input id="academicMarks" name="academicMarks" type="number" min="0" max="100" step="0.1" placeholder="e.g. 89.5" required />
          </div>

          <div class="field">
            <label for="annualFamilyIncome">Annual family income (₹)</label>
            <input id="annualFamilyIncome" name="annualFamilyIncome" type="number" min="0" step="1000" placeholder="e.g. 240000" required />
          </div>

          <div class="field">
            <label for="specialCondition">Scholarship-specific eligibility</label>
            <textarea id="specialCondition" name="specialCondition" rows="4" placeholder="E.g. Need to show leadership, disability status, first-generation applicant, etc."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="button button-primary">Save Profile</button>
          <button type="button" id="clear-profile" class="button button-secondary">Reset</button>
        </div>

        <div id="profile-message" class="form-message" aria-live="polite"></div>
      </form>
    </main>
  </div>

  <script src="./js/app.js"></script>
  <script src="./js/profile.js"></script>
</body>
</html>
